[alembic]
# Path to migration scripts, relative to this file's location.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the "created date" comment in generated migration files.
timezone = UTC

# sourceless mode / version path separators — defaults are fine.
version_path_separator = os

# The actual database URL is injected at runtime by alembic/env.py from
# app.core.config.get_settings(), NOT hard-coded here, so migrations
# always target whatever DATABASE_URL is currently configured.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
