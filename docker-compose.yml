# ==============================================================================
# PatientTriage.ai — Docker Compose
# ==============================================================================
# Brings up the full local stack: FastAPI backend + Vite/React frontend.
#
# Usage:
#   docker compose up --build
#
# Backend:  http://localhost:8000  (docs at /docs)
# Frontend: http://localhost:5173
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient_triage_backend
    ports:
      - "8000:8000"
    volumes:
      # Live-reload source during development.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Persist the SQLite DB, raw data, and ML reports on the host.
      - ./backend/data:/app/data
      - ./backend/reports:/app/reports
    environment:
      - PROJECT_NAME=PatientTriage.ai
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:///./data/patient_triage.db
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
      - LOG_LEVEL=INFO
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patient_triage_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Anonymous volume so the container's own node_modules (built for
      # linux) isn't shadowed by a host-mounted (possibly macOS/Windows) one.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_HOST=backend
    depends_on:
      - backend

networks:
  default:
    name: patient_triage_network
